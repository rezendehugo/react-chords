services:
  chords-tester:
    container_name: chords-tester
    build:
      context: ./my-chords-tester
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Hot-reload for source code changes
      - ./my-chords-tester/src:/app/src
      - ./my-chords-tester/public:/app/public
      # Link to local react-chords library
      - ./lib:/app/node_modules/@tombatossals/react-chords/lib
      # Link to local chords-db for testing cavaquinho
      - ../chords-db/lib:/app/node_modules/@tombatossals/chords-db/lib
      # Prevent node_modules from being overwritten
      - /app/node_modules
    environment:
      NODE_ENV: development
      REACT_APP_ENV: development
      SKIP_PREFLIGHT_CHECK: 'true'
      DANGEROUSLY_DISABLE_HOST_CHECK: 'true'
    stdin_open: true
    tty: true

networks:
  default:
    name: react-chords-network
